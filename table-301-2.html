DETAILED ACTION

Notice of Pre-A/A or A/A Status

The present application,  filed on or after March  16, 2013,  is being examined  under the first inventor  to file provisions of the AIA.

Claim Rejections - 35 USC § 101

35 U.S.C. 101 reads as follows:

Whoever invents or discovers any new and us eful process, machine, manufacture, or composition of matter, or any new and useful improvementthereof, mayobtain a patent therefor, s ubject to the conditions and requirements of this title.


1.	Claims 21-40 are rejected under 35 U.S.C. 101 because the claimed invention is directed to non-statutory subject matter because the claimed invention is directed to a judicial exception (i.e., a law of nature, a natural phenomenon, or an abstract idea) without significantly more.
MPEP 2106 Step 2A-Prong  1

The claims recite:

performing, by a search service system, a priming query to obtain a plurality of prices and availabilities associated with a plurality of bookable locations, wherein the priming query is not associated with a user query;

storing the plurality of prices and availabilities obtained from the priming query in a pricing and availability maintained by the search service system;
receiving, via a user interacting, user-specified stay information and one or more criteria; identifying, using prices and availabilities,
a split-stay that satisfies the user-specified stay information and the one or more criteria, wherein
the split-stay comprises two or more legs of the stay that are indicated as available or and
wherein each leg of the stay satisfies the one or more criteria;

determining, a source of each leg of the split stay that satisfies the user -specific stay information;
 

determining, from the pricing and availability database, a price for each leg of the split ­ stay;

presenting, by the service search system and via the interactive GUI, the split -stay, the price of each leg of the split stay, and the online source of each leg of the split stay to the user;

presenting, a single element by which the user can book all legs of the split stay;
receiving, from the user, an approval of the split-stay and in response:

for each contiguous booking of the split-stay, associated with a particular lodging provider offering the booking;

transmitting, by the search service system, a booking request for the contiguous booking on behalf of the user; and

providing a confirmation of each successful booking to the user

The claims falls  into the abstract idea groupings  of (b) Certain  Methods  Of Organizing  Human Activity  ** fundamental economic principles or practices (including hedging, insurance, mitigating risk) commercial or legal interactions  (including agreements in the form of contracts; legal obligations; advertising, marketing or sales activities or behaviors; business relations) managing personal behavior or relationships or interactions betVt.€en people (including social activities, teaching, and following   rules or instructions)**  and  (c) mental processes-concepts  performed  in the human mind- (including an observation, evaluation, judgment,  opinion).
The limitations  under their  broadest reasonable  interpretation,  covers performance of the  limitation  certain  methods of  organizing  human activity  and  mental processes, but for the recitation  of generic  computer components.   That is, other than  recited, "database,  GUI,  online  source,  API, processors, non-transitory   computer  readable medium",  nothing  in the claim element  precludes the step from  practically being marketing or sales activities or behaviors; business relations) managing personal behavior  and mental processes.  Accordingly,  the claims recite an abstract idea.
 



MPEP 2106 Step 2A-Prong  2

The recited limitations are not indicative of integration  into a practical application.

In particular, the claims only recite the following additional  elements, "database, GUI, online source, API, processors, non-transitory computer readable  medium. These additional elements are recited at a high-level of generality such that in conjunction with the abstract limitations, they amount to no more than:
•	Adding the words "apply it" (or an equivalent)  with the judicial exception, or mere instructions to implement an abstract idea on a computer, or merely uses a computer as a tool to perform an abstract idea - see MPEP 2106.05(f);
- ("database, GUI, online source, API, processors, non-transitory computer readable medium)
The claims do not include additional elements individually or in an ordered combination that are sufficient to amount to significantly more than the judicial exception.	Integration  into a practical application requires the additional element(s) to              apply, rely on, or use the judicial exception in a manner that imposes a meaningful limit on the judicial exception, such that the claim is more than a drafting effort designed to monopolize the exception. This is not the case in the instant application.  Further, as discussed above with respect to integration of the abstract idea into a practical application, the additional elements amount to no more than: mere instructions to apply the exception using a generic computer component;
MPEP 2106 Step 28
 

Eligibility requires that the claim recites additional elements that amount to an inventive concept (aka "significantly  more") than the recited judicial exception. As discussed above, this is where the instant application falls short. The claims do not include additional elements individually  or in an ordered combination that are sufficient to amount to significantly more than the judicial exception
Dependent Claims Step 2A:

The limitations of the dependent claims but for those addressed below merely set forth further refinements of the abstract idea without changing the analysis already presented (that is, they further limit the organizing of human activities at step 2A - Prong One without adding any new additional elements other than those already analyzed above with respect to the independent claims at 2A - Prong Two; moreover claims 23, 30 and 37 and their analogous claims also further recite certain methods of organizing human activity).
Dependent Claims Step 28:

The dependent claims merely use the same general technological  environment and instructions to implement the abstract idea as the independent  claims without
adding any new additional elements. Accordingly, they are not directed to significantly more than the exception itself, and are not eligible subject matter under § 101.
